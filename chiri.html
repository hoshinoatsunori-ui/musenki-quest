<!--
  地理クエスト
  Version 1.8
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>地理クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #0a0a12;
    --panel: #000000;
    --line: #ffffff;
    --soft: #1a1a2e;
    --ink: #ffffff;
    --muted: #8a8aa0;
    --primary: #4a6ec8;
    --accent: #ffd23f;
    --correct: #4ade80;
    --danger: #e63946;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-base);
    color: var(--ink);
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    overflow: hidden;
    height: 100%;
    touch-action: manipulation;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .screen {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    /* 画面の小さい端末で中身がはみ出しても操作できなくならないようにする */
    overflow-y: auto;
  }
  .screen.active { display: flex; }

  /* ファミコン風の二重枠ウィンドウ。角に切り欠きを入れて既製品っぽさを消す */
  .window {
    position: relative;
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 2px;
    box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px rgba(255,255,255,.28);
    padding: 15px 17px;
  }
  .window::before,
  .window::after {
    content: '';
    position: absolute;
    width: 7px;
    height: 7px;
    border: 2px solid var(--line);
    pointer-events: none;
  }
  .window::before {
    top: 3px; left: 3px;
    border-right: none; border-bottom: none;
  }
  .window::after {
    bottom: 3px; right: 3px;
    border-left: none; border-top: none;
  }

  /* ===== タイトル画面 ===== */
  #titleScreen { gap: 0; }
  .title-box { width: min(560px, 94vw); text-align: center; }
  .title-logo {
    font-size: clamp(30px, 7.5vw, 52px);
    letter-spacing: .14em;
    margin: 8px 0 4px;
    color: var(--accent);
    /* ドットを重ねて縁取りと落ち影を作る */
    text-shadow:
      -3px 0 0 #1a1a2e,  3px 0 0 #1a1a2e,
      0 -3px 0 #1a1a2e,  0 3px 0 #1a1a2e,
      -3px -3px 0 #1a1a2e, 3px -3px 0 #1a1a2e,
      -3px 3px 0 #1a1a2e,  3px 3px 0 #1a1a2e,
      5px 6px 0 #7a4b00, 6px 7px 0 #4a2d00;
  }
  .title-rule {
    height: 3px;
    background: repeating-linear-gradient(90deg,
      var(--accent) 0 6px, transparent 6px 12px);
    margin: 10px auto 12px;
    width: 80%;
  }
  .title-sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; letter-spacing: .08em; }
  #titleCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    margin: 10px auto 12px;
    border: 2px solid var(--line);
    max-width: 100%;
  }
  .field-row { text-align: left; margin-bottom: 14px; }
  .field-row label { display: block; font-size: 14px; margin-bottom: 6px; color: var(--accent); }
  .field-row input, .field-row select {
    width: 100%;
    background: #101020;
    color: var(--ink);
    border: 2px solid var(--line);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 16px;
    border-radius: 2px;
  }
  .field-row input:focus, .field-row select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border: 2px solid var(--line);
    padding: 12px 22px;
    font-family: inherit;
    font-size: 17px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: .06em;
    transition: transform .06s;
  }
  .btn:hover { background: #5a80e0; }
  .btn:active { transform: translateY(2px); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--muted); font-size: 14px; padding: 8px 14px; }

  #titleMessage { margin-top: 14px; font-size: 13px; min-height: 20px; color: var(--accent); }

  /* ===== フィールド画面 ===== */
  #gameScreen { justify-content: flex-start; padding-top: 6px; gap: 6px; }

  .status-bar {
    width: min(720px, 96vw);
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 13px;
    padding: 8px 12px;
  }
  .status-bar .stat { display: flex; gap: 5px; align-items: baseline; }
  .status-bar .stat b {
    color: var(--accent);
    font-weight: normal;
    border: 2px solid var(--accent);
    padding: 0 5px;
    font-size: 11px;
    line-height: 1.5;
  }
  .hp-bar {
    flex: 1;
    height: 12px;
    background: #2a2a3a;
    border: 2px solid var(--line);
    position: relative;
    min-width: 60px;
  }
  .hp-bar span {
    display: block;
    height: 100%;
    background: var(--correct);
    transition: width .25s;
  }
  .hp-bar.low span { background: var(--danger); }

  #fieldCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 3px solid var(--line);
    background: #000;
    max-width: 96vw;
    max-height: 62vh;
  }

  .field-hint { font-size: 12px; color: var(--muted); letter-spacing: .05em; }

  /* タッチ用の十字キー */
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 4px;
    margin-top: 2px;
  }
  #dpad button {
    background: #1a1a2e;
    color: var(--ink);
    border: 2px solid var(--line);
    font-size: 20px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 2px;
  }
  #dpad button:active { background: var(--primary); }
  #dpad .spacer { visibility: hidden; }

  /* ===== バトル画面 ===== */
  #battleScreen { justify-content: flex-start; padding-top: 6px; gap: 6px; }

  .battle-stage {
    position: relative;
    width: min(720px, 96vw);
    background: #000;
    border: 3px solid var(--line);
    padding: 10px 0 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 236px;
    justify-content: center;
    overflow: hidden;
    transition: background .4s;
  }

  /* 地形ごとの色味。背景画像を活かすため、薄く重ねるだけにする */
  .battle-stage.terrain-g { box-shadow: inset 0 0 120px 40px rgba(20, 60, 25, .75); }
  .battle-stage.terrain-f { box-shadow: inset 0 0 120px 40px rgba(8, 30, 14, .8); }
  .battle-stage.terrain-d { box-shadow: inset 0 0 120px 40px rgba(60, 42, 8, .7); }

  .battle-stage {
    background-repeat: repeat;
    background-size: 128px 128px;
    image-rendering: pixelated;
  }

  /* 地面のライン */
  .battle-stage::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 34px;
    background: rgba(0, 0, 0, .35);
    border-top: 2px solid rgba(255, 255, 255, .18);
    pointer-events: none;
  }
  .battle-stage > * { position: relative; z-index: 2; }

  /* ダメージ数値のポップアップ */
  .damage-pop {
    position: absolute;
    top: 26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    color: #fff;
    text-shadow: 3px 3px 0 #000, -1px -1px 0 #000;
    pointer-events: none;
    opacity: 0;
    z-index: 3;
  }
  .damage-pop.enemy { color: var(--accent); }
  .damage-pop.player { color: var(--danger); }
  .damage-pop.show { animation: popUp .85s ease-out; }
  @keyframes popUp {
    0%   { opacity: 1; transform: translateX(-50%) translateY(6px) scale(.7); }
    25%  { opacity: 1; transform: translateX(-50%) translateY(-18px) scale(1.2); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-44px) scale(1); }
  }

  /* 被弾時の画面フラッシュ */
  #flash {
    position: fixed;
    inset: 0;
    background: var(--danger);
    opacity: 0;
    pointer-events: none;
    z-index: 60;
  }
  #flash.hit { animation: flashRed .32s ease-out; }
  @keyframes flashRed {
    0%   { opacity: .45; }
    100% { opacity: 0; }
  }

  /* 音のオンオフ */
  .sound-toggle {
    background: transparent;
    border: 2px solid var(--muted);
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 2px;
  }
  .sound-toggle.on { border-color: var(--accent); color: var(--accent); }
  /* 敵の足元の影。地面に立っている感じを出す */
  .enemy-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
  .enemy-wrap::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 120px;
    height: 16px;
    background: rgba(0, 0, 0, .45);
    border-radius: 50%;
    z-index: -1;
  }

  #enemyCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transition: opacity .12s;
  }
  /* 待機中はゆっくり上下に動かす。止まっていると絵に見えてしまう */
  #enemyCanvas { animation: idleFloat 2.4s ease-in-out infinite; }
  @keyframes idleFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  #enemyCanvas.appear { animation: enemyAppear .45s ease-out; }
  @keyframes enemyAppear {
    0%   { opacity: 0; transform: translateY(18px) scale(.85); }
    60%  { opacity: 1; transform: translateY(-4px) scale(1.04); }
    100% { opacity: 1; transform: none; }
  }
  #enemyCanvas.hit { animation: shake .3s; }
  #enemyCanvas.defeated { opacity: 0; transform: scale(.85) rotate(6deg); transition: opacity .35s, transform .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .enemy-name { font-size: 14px; margin-top: 6px; color: var(--accent); }
  .enemy-hp {
    width: 180px; height: 10px; background: #2a2a3a;
    border: 2px solid var(--line); margin-top: 4px;
  }
  .enemy-hp span { display: block; height: 100%; background: var(--danger); transition: width .25s; }

  .battle-window { width: min(720px, 96vw); }
  #questionText { font-size: clamp(15px, 2.4vw, 18px); line-height: 1.7; margin-bottom: 12px; }
  #questionField { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

  .choices { display: grid; gap: 8px; }
  .choice {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #101020;
    border: 2px solid var(--line);
    color: var(--ink);
    padding: 11px 14px;
    font-family: inherit;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    border-radius: 2px;
    line-height: 1.5;
  }
  .choice:hover:not([disabled]) { background: #1c2a52; border-color: var(--accent); }
  .choice .cursor { color: var(--accent); opacity: 0; }
  .choice:hover:not([disabled]) .cursor { opacity: 1; }
  .choice[disabled] { cursor: default; }
  .choice.correct { background: #14532d; border-color: var(--correct); }
  .choice.wrong { background: #4c1519; border-color: var(--danger); }

  #battleMessage {
    margin-top: 10px;
    font-size: 15px;
    line-height: 1.7;
    min-height: 26px;
  }
  #battleMessage .note { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; }
  #battleMessage .lvup { color: var(--accent); }

  /* メッセージを読み終わった合図 */
  .msg-cursor {
    text-align: right;
    color: var(--accent);
    font-size: 15px;
    height: 18px;
    opacity: 0;
  }
  .msg-cursor.show { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  .battle-actions { margin-top: 10px; text-align: right; }

  /* ===== 汎用オーバーレイ ===== */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.86);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  #overlay.active { display: flex; }
  .overlay-box { width: min(480px, 94vw); text-align: center; }
  .overlay-box h2 { font-size: 22px; margin: 0 0 12px; color: var(--accent); }
  .overlay-box p { font-size: 15px; line-height: 1.8; margin: 0 0 16px; }

  #saveState {
    position: fixed;
    right: 10px;
    bottom: 8px;
    font-size: 11px;
    color: var(--muted);
    z-index: 10;
  }

  @media (max-width: 560px) {
    #dpad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); }
    .status-bar { font-size: 11px; gap: 6px; padding: 6px 8px; }
    .window { padding: 10px 12px; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- ===== タイトル画面 ===== -->
  <div id="titleScreen" class="screen active">
    <div class="window title-box">
      <h1 class="title-logo">地理クエスト</h1>
      <canvas id="titleCanvas" width="480" height="96"></canvas>
      <p class="title-sub">～ 地図の勇者になれ ～</p>
      <div class="title-rule"></div>

      <div class="field-row">
        <label for="inputName">なまえ</label>
        <input id="inputName" type="text" maxlength="12" placeholder="やまだ たろう" autocomplete="off">
      </div>
      <div class="field-row">
        <label for="inputClass">クラス</label>
        <select id="inputClass"></select>
      </div>

      <button id="startBtn" class="btn">ぼうけんを はじめる</button>
      <div id="titleMessage">よみこみちゅう...</div>
      <div style="margin-top:12px">
        <button id="soundBtn" class="sound-toggle on">♪ おと ON</button>
      </div>
    </div>
  </div>

  <!-- ===== フィールド画面 ===== -->
  <div id="gameScreen" class="screen">
    <div class="window status-bar">
      <div class="stat"><b>Lv</b><span id="statLevel">1</span></div>
      <div class="stat"><b>HP</b><span id="statHp">25/25</span></div>
      <div class="hp-bar" id="hpBar"><span style="width:100%"></span></div>
      <div class="stat"><b>EXP</b><span id="statExp">0</span></div>
    </div>

    <canvas id="fieldCanvas"></canvas>
    <div class="field-hint">やじるしキー か 下のボタンで あるく</div>

    <div id="dpad">
      <div class="spacer"></div>
      <button data-dir="up" aria-label="うえ">▲</button>
      <div class="spacer"></div>
      <button data-dir="left" aria-label="ひだり">◀</button>
      <button id="menuBtn" aria-label="メニュー">■</button>
      <button data-dir="right" aria-label="みぎ">▶</button>
      <div class="spacer"></div>
      <button data-dir="down" aria-label="した">▼</button>
      <div class="spacer"></div>
    </div>
  </div>

  <!-- ===== バトル画面 ===== -->
  <div id="battleScreen" class="screen">
    <div class="window status-bar">
      <div class="stat"><b>Lv</b><span id="battleLevel">1</span></div>
      <div class="stat"><b>HP</b><span id="battleHp">25/25</span></div>
      <div class="hp-bar" id="battleHpBar"><span style="width:100%"></span></div>
    </div>

    <div class="battle-stage">
      <div class="damage-pop" id="damagePop"></div>
      <div class="enemy-wrap">
        <canvas id="enemyCanvas" width="192" height="192"></canvas>
      </div>
      <div class="enemy-name" id="enemyName">スライム</div>
      <div class="enemy-hp"><span id="enemyHpBar" style="width:100%"></span></div>
    </div>

    <div class="window battle-window">
      <div id="questionField"></div>
      <div id="questionText"></div>
      <div class="choices" id="choices"></div>
      <div id="battleMessage"></div>
      <div class="msg-cursor" id="msgCursor">▼</div>
      <div class="battle-actions">
        <button id="nextBtn" class="btn" style="display:none">つぎへ</button>
      </div>
    </div>
  </div>

  <!-- ===== オーバーレイ ===== -->
  <div id="overlay">
    <div class="window overlay-box">
      <h2 id="overlayTitle"></h2>
      <p id="overlayText"></p>
      <button id="overlayBtn" class="btn"></button>
    </div>
  </div>

  <div id="saveState"></div>
  <div id="flash"></div>
</div>

<script>
// =====================================================================
//  地理クエスト — クライアント本体
//
//  設計の要点:
//   1. サーバー通信は「起動時に1回」と「10問ごと/終了時」だけ。
//      140人が同時に使ってもGASの同時実行数を食いつぶさないための構造。
//   2. 画像ファイルを1枚も使わない。キャラも敵も下のドット絵データから
//      Canvasに直接描く。だから配布は3ファイルで完結する。
// =====================================================================

'use strict';

// ===== ドット絵 =====
// 1文字=1ドット。'.'は透明。それ以外はPALETTEのキー。
const PALETTE = {
  '1': '#101018', // 黒(輪郭)
  '2': '#ffffff', // 白
  '3': '#2f7d32', // 濃い緑
  '4': '#6abf4b', // 明るい緑
  '5': '#8d5524', // 茶
  '6': '#5a3410', // 濃い茶
  '7': '#2f4fa8', // 青
  '8': '#6fc3ff', // 水色
  '9': '#d63b3b', // 赤
  'a': '#f2c199', // 肌
  'b': '#ffd23f', // 黄(金)
  'c': '#8b5cf6', // 紫
  'd': '#b8b8c8', // 明るい灰
  'e': '#6b6b7c', // 濃い灰
  'f': '#f78fb3', // 桃
  'g': '#1a2f6b', // 濃紺（青の影）
  'h': '#5b3a9e', // 濃紫（紫の影）
  'i': '#3d3d4a', // 濃灰（岩の目地）
  'j': '#8b1f1f', // 濃赤（赤の影）
  'k': '#1f5a24'  // 濃緑（緑の影）
};

// 勇者(下向き) 2フレーム
const SPR_HERO_DOWN = [
  [
    '................................................................',
    '................................................................',
    '..............................bbbb..............................',
    '.............................5bbbbb.............................',
    '..........................dd855bbbb8dd..........................',
    '.......................dd882255bbbb2288dd.......................',
    '.....................dd88222255bbbb222288dd.....................',
    '....................dd882222255bbbb2222288dd....................',
    '...................dd8822222255bbbb22222288dd...................',
    '..................dd88888888855bbbb888888888dd..................',
    '..................dd88888888855bbbb888888888dd..................',
    '.................dd888888888855bbbb8888888888dd.................',
    '.................dd888888888855bbbb8888888888dd.................',
    '.................dd888888888855bbbb8888888888dd.................',
    '.................dd88555555555555555555555588dd.................',
    '.................dd88555555555555555555555588dd.................',
    '.................8888aa666666aaaaaa666666aa8888.................',
    '.................8888aa666666aaaaaa666666aa8888.................',
    '.................8888aaa22222aaaaaaa22222aa8888.................',
    '.................8888aaa22112aaaaaaa22112aa8888.................',
    '.................8888aaa21112aaaaaaa21112aa8888.................',
    '.................8888aaa21112aa55aaa21112aa8888.................',
    '.................8888aaaaaaaaaa55aaaaaaaaaa8888.................',
    '.................8888aaaaaaaa555555aaaaaaaa8888.................',
    '.................ddddaaaaaaaa555555aaaaaaaadddd.................',
    '.................ddddddg7777777777777777gdddddd.................',
    '...............j.dddddd777777777777777777dddddd.j...............',
    '...............j.dddddd788888777777888887dddddd.j...............',
    '...............j.dddddd78888877bb77888887dddddd.j...............',
    '...............jjdddddd788888bbbbbb888887ddddddjj...............',
    '...............jjeeeeee788888bbbbbb888887eeeeeejj...............',
    '...............jjeeeeee78888877bb77888887eeeeeejj...............',
    '...............jj9ggg7778888877bb7788888777ggg9jj...............',
    '..............jgg77777778888877bb77888887777777ggj..............',
    '..............jgg7777g77888887777778888877g7777ggj..............',
    '.............jjgg7777g77888887777778888877g7777ggjj.............',
    '.............jjgg7777gg777777777777777777gg7777ggjj.............',
    '............jj9gg7777gg777777777777777777gg7777gg9jj............',
    '............jj9gg7777ggg7777777777777777ggg7777gg9jj............',
    '............jj9gg7777ggg77777bbbbbb77777ggg7777gg9jj............',

// ===== 効果音 =====
// 音声ファイルは持たない。ファミコンと同じ矩形波をその場で合成して鳴らす。
const sound = {
  ctx: null,
  enabled: true,

  // ブラウザは操作なしに音を出せないので、最初のクリックで初期化する
  init: function () {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    } catch (e) { this.ctx = null; }
  },

  tone: function (freq, dur, type, vol, delay) {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(vol || 0.05, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  },

  // 周波数を滑らかに動かす音（エンカウントの「ヒュゥン」など）
  sweep: function (from, to, dur, vol) {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(from, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(30, to), t0 + dur);
    gain.gain.setValueAtTime(vol || 0.05, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  },

  // ノイズ（被弾のザッという音）
  noise: function (dur, vol) {
    if (!this.enabled || !this.ctx) return;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    const gain = this.ctx.createGain();
    src.buffer = buf;
    gain.gain.value = vol || 0.05;
    src.connect(gain);
    gain.connect(this.ctx.destination);
    src.start();
  },

  seq: function (notes, vol) {
    let t = 0;
    const self = this;
    notes.forEach(function (n) {
      self.tone(n[0], n[1], 'square', vol || 0.05, t);
      t += n[1] * 0.9;
    });
  },

  // 以下、場面ごとの音
  select:    function () { this.tone(880, 0.05, 'square', 0.04); },
  decide:    function () { this.seq([[660, 0.05], [990, 0.09]], 0.05); },

// ===== メッセージのタイプライター表示 =====
// ドラクエらしさの核。HTMLタグは崩さず、テキストだけ1文字ずつ出す。
let typingTimer = null;
function typeMessage(el, html, done) {
  const cursor = $('msgCursor');
  if (cursor) cursor.classList.remove('show');
  clearInterval(typingTimer);
  el.innerHTML = html;

  // テキストノードを集めて、いったん全部空にする
  const nodes = [];
  (function walk(n) {
    for (let i = 0; i < n.childNodes.length; i++) {
      const c = n.childNodes[i];
      if (c.nodeType === 3) { nodes.push({ node: c, text: c.nodeValue }); c.nodeValue = ''; }
      else walk(c);
    }
  })(el);

  let ni = 0, ci = 0;
  typingTimer = setInterval(function () {
    if (ni >= nodes.length) {
      clearInterval(typingTimer);
      const c = $('msgCursor');
      if (c && el.id === 'battleMessage' && el.textContent.trim()) c.classList.add('show');
      if (done) done();
      return;
    }
    const cur = nodes[ni];
    cur.node.nodeValue = cur.text.slice(0, ++ci);
    if (ci >= cur.text.length) { ni++; ci = 0; }
  }, 22);
}

function skipTyping(el, html) {
  clearInterval(typingTimer);
  el.innerHTML = html;
}

  ['titleScreen', 'gameScreen', 'battleScreen'].forEach(function (id) {
    $(id).classList.toggle('active', id === name);

}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ===== ドット絵の描画 =====
function drawSprite(ctx, sprite, dx, dy, scale, flip) {
  for (let row = 0; row < sprite.length; row++) {
    const line = sprite[row];
    for (let col = 0; col < line.length; col++) {
      const ch = line[col];
      if (ch === '.' || ch === ' ') continue;
      const color = PALETTE[ch];
      if (!color) continue;
      const px = flip ? (line.length - 1 - col) : col;
      ctx.fillStyle = color;
      ctx.fillRect(dx + px * scale, dy + row * scale, scale, scale);
    }
  }
}

// ===== スプライトのキャッシュ =====
// 1ドットずつ塗る処理は重い。64x64のタイルを毎フレーム塗り直すと
// 画面全体で数十万回の描画になり、非力な端末では動かない。
// そこで各スプライトを起動時に一度だけ小さなCanvasへ焼いておき、
// 以後はその画像を貼るだけにする。
const spriteCache = {};

function bakeSprite(key, sprite, scale, flip) {
  const cached = spriteCache[key];
  if (cached) return cached;
  const c = document.createElement('canvas');
  c.width = sprite[0].length * scale;
  c.height = sprite.length * scale;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  drawSprite(ctx, sprite, 0, 0, scale, flip);
  spriteCache[key] = c;
  return c;
}

// 地形はタイルデータから描く。同じ絵が並んで格子模様に見えないよう、
// 座標からパターンを選び分ける。
function tileVariantIndex(type, wx, wy) {
  const variants = SPR_TILE[type];
  if (!variants || variants.length === 1) return 0;
  // 座標をかき混ぜて、規則的な縞にならないようにする
  return Math.abs(((wx * 73856093) ^ (wy * 19349663)) % variants.length);
}

// 地形が変わる辺に「にじみ」を描く。
// タイルを独立して描くと境界が直線で切れて地図に見えないので、
// 隣が別の地形の辺だけ、その地形らしい縁取りを重ねる。
const EDGE_STYLE = {
  // 水は岸に白波
  w: { color: '#ffffff', unit: 2, bump: 1, gap: 3 },
  // 道は土が草へにじむ
  r: { color: '#8d5524', unit: 3, bump: 2, gap: 2 },
  // 砂漠は砂が草へ散る
  d: { color: '#e8c98a', unit: 3, bump: 2, gap: 2 }
};

function edgeMask(wx, wy, sameSet) {
  let m = 0;
  if (!sameSet[tileAt(wx, wy - 1)]) m |= 1;
  if (!sameSet[tileAt(wx + 1, wy)]) m |= 2;
  if (!sameSet[tileAt(wx, wy + 1)]) m |= 4;
  if (!sameSet[tileAt(wx - 1, wy)]) m |= 8;
  return m;
}

const SAME_AS = {
  w: { w: true, b: true },     // 水と橋は地続き扱い
  r: { r: true, b: true, t: true, v: true, c: true },  // 道は町や城と繋がる
  d: { d: true }
};

function bakeEdged(key, sprite, scale, mask, style) {
  const cached = spriteCache[key];
  if (cached) return cached;

  const c = document.createElement('canvas');
  c.width = sprite[0].length * scale;
  c.height = sprite.length * scale;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  drawSprite(ctx, sprite, 0, 0, scale, false);

  const w = c.width, h = c.height;
  const u = Math.max(1, Math.round(style.unit * scale));
  ctx.fillStyle = style.color;

  // 辺に沿って、厚みを不規則に変えながら縁を置く
  function edge(horizontal, atFar) {
    const len = horizontal ? w : h;
    for (let i = 0; i < len; i += u) {
      const step = i / u;
      const t = u + ((step % style.gap === 0) ? u * style.bump : 0);
      if (horizontal) ctx.fillRect(i, atFar ? h - t : 0, u, t);
      else ctx.fillRect(atFar ? w - t : 0, i, t, u);
    }
  }
  if (mask & 1) edge(true, false);
  if (mask & 2) edge(false, true);
  if (mask & 4) edge(true, true);
  if (mask & 8) edge(false, false);

  spriteCache[key] = c;
  return c;
}

// 動く地形。止まった絵より、水が流れて草が揺れている方が生きた画面に見える。
// コマは起動時に焼いて使い回すので、動かしても速度は変わらない。
let tileFrame = 0;

function animSprite(type, vi, wx, wy) {
  const frames = SPR_TILE_ANIM[type];
  if (!frames) return null;
  // マスごとに位相をずらす。全部が同じ拍子で動くと機械的に見える
  const phase = Math.abs((wx * 3 + wy * 5)) % frames.length;
  return { sprite: frames[(tileFrame + phase) % frames.length],
           key: 'a' + type + ((tileFrame + phase) % frames.length) };
}

function drawTile(ctx, type, dx, dy, scale, wx, wy) {
  const variants = SPR_TILE[type];
  if (!variants) return;
  const vi = tileVariantIndex(type, wx, wy);

  // 動く地形は、その時のコマを使う（草はパターンを持つので1種類目だけ動かす）
  const anim = (type === 'w' || (vi === 0 && SPR_TILE_ANIM[type]))
    ? animSprite(type, vi, wx, wy) : null;
  const sprite = anim ? anim.sprite : variants[vi];
  const baseKey = anim ? anim.key : ('t' + type + vi);

  let img;
  const style = EDGE_STYLE[type];
  if (style) {
    const mask = edgeMask(wx, wy, SAME_AS[type]);
    img = mask
      ? bakeEdged('e' + baseKey + '_' + mask + '@' + scale, sprite, scale, mask, style)
      : bakeSprite(baseKey + '@' + scale, sprite, scale, false);
  } else {
    img = bakeSprite(baseKey + '@' + scale, sprite, scale, false);
  }
  ctx.drawImage(img, Math.round(dx), Math.round(dy));
}

function drawCachedSprite(ctx, key, sprite, dx, dy, scale, flip) {
  const img = bakeSprite(key + '@' + scale + (flip ? 'f' : ''), sprite, scale, flip);
  ctx.drawImage(img, Math.round(dx), Math.round(dy));
}

// ===== フィールド描画 =====
const fieldCanvas = $('fieldCanvas');
const fieldCtx = fieldCanvas.getContext('2d');
fieldCanvas.width = VIEW_W * TILE * SCALE;
fieldCanvas.height = VIEW_H * TILE * SCALE;
fieldCtx.imageSmoothingEnabled = false;

function tileAt(x, y) {
  if (y < 0 || y >= MAP.length) return 'w';
  const row = MAP[y];
  if (x < 0 || x >= row.length) return 'w';
  return row[x];
}

function renderField() {
  const s = SCALE;
  const size = TILE * s;

  // 移動アニメ中は途中の位置を使う
  let px = state.x, py = state.y;
  let offX = 0, offY = 0;
  if (state.moving) {
    const t = state.moving.progress;
    offX = -(state.moving.dx * t * size);
    offY = -(state.moving.dy * t * size);
  }

  const centerCol = Math.floor(VIEW_W / 2);
  const centerRow = Math.floor(VIEW_H / 2);

  fieldCtx.fillStyle = '#000';
  fieldCtx.fillRect(0, 0, fieldCanvas.width, fieldCanvas.height);

  for (let row = -1; row <= VIEW_H; row++) {
    for (let col = -1; col <= VIEW_W; col++) {
      const wx = px - centerCol + col;
      const wy = py - centerRow + row;
      const dx = col * size + offX;
      const dy = row * size + offY;
      drawTile(fieldCtx, tileAt(wx, wy), dx, dy, s, wx, wy);
    }
  }

  // 勇者は常に画面中央。スプライトは24ドットでタイル(16)より大きいので、
  // 足元をタイルの下端に合わせて、頭がはみ出す形にする
  let sprite, key;
  if (state.dir === 'up') { sprite = SPR_HERO_UP[state.frame]; key = 'hu' + state.frame; }
  else if (state.dir === 'down') { sprite = SPR_HERO_DOWN[state.frame]; key = 'hd' + state.frame; }
  else { sprite = SPR_HERO_RIGHT[state.frame]; key = 'hr' + state.frame; }
  const flip = (state.dir === 'left');
  const overhang = (HERO_SIZE - TILE) * s;
  drawCachedSprite(fieldCtx, key, sprite,
    centerCol * size - overhang / 2, centerRow * size - overhang, s, flip);
}

// ===== 移動 =====
const DIRS = {
  up: { dx: 0, dy: -1 },
  down: { dx: 0, dy: 1 },
  left: { dx: -1, dy: 0 },
  right: { dx: 1, dy: 0 }
};

function tryMove(dir) {
  if (state.moving || state.battle) return;
  state.dir = dir;
  const d = DIRS[dir];
  const nx = state.x + d.dx;
  const ny = state.y + d.dy;
  const t = tileAt(nx, ny);
  if (!PASSABLE[t]) {
    sound.blocked();
    renderField();
    return;
  }
  sound.step();
  state.moving = { dx: d.dx, dy: d.dy, progress: 0, to: { x: nx, y: ny } };
}

function updateMove() {
  if (!state.moving) return;
  state.moving.progress += 0.25;
  if (state.moving.progress >= 1) {
    state.x = state.moving.to.x;
    state.y = state.moving.to.y;
    state.moving = null;
    state.frame = state.frame === 0 ? 1 : 0;
    state.steps++;
    onStepFinished();
  }
}

// 1歩ぶん進み終わった時の処理
function onStepFinished() {
  const t = tileAt(state.x, state.y);

  // 町・村・城では体力が回復する。何度も全滅して心が折れないようにするため
  if (REST_TILE[t]) {
    if (state.hp < state.maxHp) {
      state.hp = state.maxHp;
      updateStatus();
      sound.heal();
      const place = t === 'c' ? 'おしろ' : (t === 'v' ? 'むら' : 'まち');
      setSaveState(place + 'で やすんだ！ HPが かいふく');
    }
    return;   // 安全地帯なので敵は出ない
  }

  checkEncounter();
}

function checkEncounter() {
  const t = tileAt(state.x, state.y);
  const weight = ENCOUNTER_TILE[t] || 0;
  if (weight <= 0) return;
  if (state.steps < 3) return;   // 開始直後にいきなり出ないように
  const chance = state.encounterRate * weight;
  if (Math.random() * 100 < chance) {
    state.battleTerrain = t;
    startBattle(TILE_DIFFICULTY[t] || 1);
  }
}

// ===== タイトル画面の演出 =====
// 夜空の下を、勇者が魔物たちに追われながら歩き続ける。
const titleCanvas = $('titleCanvas');
const titleCtx = titleCanvas.getContext('2d');
titleCtx.imageSmoothingEnabled = false;

const TITLE_STARS = [];
for (let i = 0; i < 26; i++) {
  TITLE_STARS.push({
    x: Math.floor(Math.random() * 480),
    y: Math.floor(Math.random() * 48),
    phase: Math.floor(Math.random() * 60)
  });
}
const TITLE_ENEMIES = ['slime', 'bat', 'golem', 'mush', 'devil'];
let titleFrame = 0;

function renderTitle() {
  titleFrame++;
  const w = titleCanvas.width, h = titleCanvas.height;

  // 夜空
  titleCtx.fillStyle = '#0a0a20';
  titleCtx.fillRect(0, 0, w, h);
  TITLE_STARS.forEach(function (s) {
    const blink = ((titleFrame + s.phase) % 60) < 42;
    if (!blink) return;
    titleCtx.fillStyle = '#ffffff';
    titleCtx.fillRect(s.x, s.y, 2, 2);
  });

  // 月
  titleCtx.fillStyle = '#ffd23f';
  titleCtx.fillRect(410, 12, 16, 16);
  titleCtx.fillStyle = '#0a0a20';
  titleCtx.fillRect(404, 8, 14, 14);

  // 地面
  titleCtx.fillStyle = '#2a5c33';
  titleCtx.fillRect(0, h - 26, w, 26);
  titleCtx.fillStyle = '#357f42';
  for (let i = 0; i < w; i += 8) {
    const n = (i * 7 + 13) % 5;
    titleCtx.fillRect(i, h - 26 + n, 3, 2);
  }

  // 勇者と魔物の行列。右から左へ流れ、端まで来たら戻る
  const scroll = (titleFrame * 1.1) % (w + 260);
  const baseX = w + 60 - scroll;
  const walk = Math.floor(titleFrame / 7) % 2;
  const bob = (Math.floor(titleFrame / 7) % 2) ? 0 : 1;

  TITLE_ENEMIES.forEach(function (key, i) {
    const ex = baseX + 56 + i * 50;
    if (ex < -40 || ex > w + 40) return;
    drawSprite(titleCtx, SPR_ENEMY[key], ex, h - 26 - 44 + bob, 0.72, false);
  });

  if (baseX > -40 && baseX < w + 40) {
    drawSprite(titleCtx, SPR_HERO_RIGHT[walk], baseX, h - 26 - 50, 0.85, true);
  }
}

// ===== ゲームループ =====
let lastTime = 0;
let animTick = 0;
function loop(now) {
  if (now - lastTime > 33) {
    lastTime = now;
    updateMove();
    // 地形のコマ送り。速すぎるとチカチカするので約0.4秒に1コマ
    if (++animTick % 12 === 0) tileFrame++;
    if ($('gameScreen').classList.contains('active')) renderField();
    else if ($('titleScreen').classList.contains('active')) renderTitle();
  }
  requestAnimationFrame(loop);
}

// ===== ステータス表示 =====
function updateStatus() {
  const hpText = state.hp + '/' + state.maxHp;
  const ratio = Math.max(0, state.hp / state.maxHp);
  const low = ratio <= 0.3;

  $('statLevel').textContent = state.level;
  $('statHp').textContent = hpText;
  $('statExp').textContent = state.exp;
  $('hpBar').classList.toggle('low', low);
  $('hpBar').firstElementChild.style.width = (ratio * 100) + '%';

  $('battleLevel').textContent = state.level;
  $('battleHp').textContent = hpText;
  $('battleHpBar').classList.toggle('low', low);
  $('battleHpBar').firstElementChild.style.width = (ratio * 100) + '%';
}

// ===== 出題 =====

// 出題する問題を選ぶ。
// 一度間違えた問題を混ぜて出し直すのがこのゲームの学習面の肝で、
// 単に全問をランダムに流すより「解けなかったものが解けるようになる」効果が高い。
function pickQuestion(terrainLevel) {
  // 間違えた問題が溜まっていたら、3回に1回くらいの割合で復習に回す。
  // 直後だと答えを覚えているだけなので、キューの先頭＝いちばん古いものから出す。
  if (state.wrongQueue.length >= 2 && Math.random() < 0.35) {
    const id = state.wrongQueue.shift();
    for (let i = 0; i < state.questions.length; i++) {
      if (state.questions[i].id === id) return state.questions[i];
    }
  }

  let pool = state.questions.filter(function (q) {
    return state.askedIds.indexOf(q.id) === -1;
  });
  if (!pool.length) { state.askedIds = []; pool = state.questions.slice(0); }

  // 地形が険しいほど難しい問題を優先する。該当がなければ全体から選ぶ
  if (terrainLevel) {
    const matched = pool.filter(function (q) {
      return Math.min(3, Math.max(1, q.level || 1)) === terrainLevel;
    });
    if (matched.length) pool = matched;
  }

  const q = pool[Math.floor(Math.random() * pool.length)];
  state.askedIds.push(q.id);
  return q;
}

// 分野ごとの成績を記録する。生徒が自分の苦手を自覚できるようにするため
function recordResult(field, correct) {
  if (!state.fieldStats[field]) state.fieldStats[field] = { correct: 0, total: 0 };
  state.fieldStats[field].total++;
  if (correct) state.fieldStats[field].correct++;
}

// 分野名から敵の種類を決める。未知の分野でも必ずどれかに割り当たる
const fieldEnemyMap = {};
function enemyForField(field) {
  if (!fieldEnemyMap[field]) {
    const used = Object.keys(fieldEnemyMap).length;
    fieldEnemyMap[field] = ENEMY_TYPES[used % ENEMY_TYPES.length];
  }
  return fieldEnemyMap[field];
}

// ===== バトル =====
const enemyCanvas = $('enemyCanvas');
const enemyCtx = enemyCanvas.getContext('2d');
enemyCtx.imageSmoothingEnabled = false;

// 地形タイルを1枚焼いて、背景の敷き詰め用データURLにする
const backdropCache = {};
function terrainBackdrop(type) {
  if (backdropCache[type]) return backdropCache[type];
  const variants = SPR_TILE[type] || SPR_TILE.g;
  // 1枚だけ敷くと同じ絵が整列して見えるので、2x2に別パターンを混ぜて焼く
  const c = document.createElement('canvas');
  c.width = TILE * 2; c.height = TILE * 2;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  for (let i = 0; i < 4; i++) {
    const v = variants[i % variants.length];
    ctx.save();
    ctx.translate((i % 2) * TILE + ((i % 2) ? TILE : 0), Math.floor(i / 2) * TILE);
    if (i % 2) ctx.scale(-1, 1);   // 右側は左右反転して繰り返しを崩す
    drawSprite(ctx, v, 0, 0, 1, false);
    ctx.restore();
  }
  // 戦闘中は敵を目立たせたいので、背景は暗く落とす
  ctx.fillStyle = 'rgba(0, 0, 0, .68)';
  ctx.fillRect(0, 0, c.width, c.height);
  const url = c.toDataURL();
  backdropCache[type] = url;
  return url;
}

function drawEnemy(type) {
  enemyCtx.clearRect(0, 0, enemyCanvas.width, enemyCanvas.height);
  const scale = enemyCanvas.width / ENEMY_SIZE;
  drawSprite(enemyCtx, SPR_ENEMY[type] || SPR_ENEMY.slime, 0, 0, scale, false);
}

function startBattle(terrainLevel) {
  const q = pickQuestion(terrainLevel);
  const enemy = enemyForField(q.field);
  // 敵の強さは「問題の難易度」と「今いる地形」の高い方に合わせる
  const difficulty = Math.min(3, Math.max(1, q.level || 1, terrainLevel || 1));

  state.battle = {
    enemy: enemy,
    enemyMaxHp: difficulty * 10,
    enemyHp: difficulty * 10,
    enemyAttack: 3 + difficulty * 2,
    exp: difficulty * 3 + 2,
    question: q,
    askedAt: Date.now(),
    answered: false
  };

  sound.encounter();
  drawEnemy(enemy.key);
  enemyCanvas.classList.remove('defeated', 'hit', 'appear');
  void enemyCanvas.offsetWidth;
  enemyCanvas.classList.add('appear');
  setTimeout(function () { enemyCanvas.classList.remove('appear'); }, 480);

  // 戦っている地形の実際のタイルを背景に敷く。
  // 単なるグラデーションより「その場所で戦っている」感が出る
  const stage = document.querySelector('.battle-stage');
  const terrain = state.battleTerrain || 'g';
  stage.className = 'battle-stage terrain-' + terrain;
  stage.style.backgroundImage = 'url(' + terrainBackdrop(terrain) + ')';
  $('enemyName').textContent = enemy.name;
  $('enemyHpBar').style.width = '100%';
  $('nextBtn').style.display = 'none';

  renderQuestion(q);
  updateStatus();
  showScreen('battleScreen');
  typeMessage($('battleMessage'), '<span style="color:var(--accent)">' + escapeHtml(enemy.name) + ' が あらわれた！</span>');
}

function renderQuestion(q) {
  $('questionField').textContent = '【' + q.field + '】';
  $('questionText').textContent = q.text;

  const box = $('choices');
  box.innerHTML = '';
  q.choices.forEach(function (choice, i) {
    if (!choice) return;
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.dataset.index = String(i + 1);
    btn.innerHTML = '<span class="cursor">▶</span><span>' + escapeHtml(choice) + '</span>';
    btn.addEventListener('click', function () { answer(i + 1); });
    box.appendChild(btn);
  });
}

function answer(selected) {
  const b = state.battle;
  if (!b || b.answered) return;
  b.answered = true;

  const q = b.question;
  const correct = (selected === q.answer);
  const seconds = (Date.now() - b.askedAt) / 1000;

  // ログはここでは送らない。たまってから、まとめて1回だけ送る
  state.pendingLogs.push({
    questionId: q.id,
    selected: selected,
    correct: correct,
    seconds: seconds,
    level: state.level
  });

  recordResult(q.field, correct);

  // 間違えた問題はあとで出し直す。正解できたらキューから1つ抜く
  if (!correct) {
    if (state.wrongQueue.indexOf(q.id) === -1) state.wrongQueue.push(q.id);
  } else {
    const at = state.wrongQueue.indexOf(q.id);
    if (at !== -1) state.wrongQueue.splice(at, 1);
  }

  const buttons = $('choices').querySelectorAll('.choice');
  buttons.forEach(function (btn) {
    btn.disabled = true;
    const idx = Number(btn.dataset.index);
    if (idx === q.answer) btn.classList.add('correct');
    else if (idx === selected) btn.classList.add('wrong');
  });

  let message = '';
  if (correct) {
    const damage = attackFor(state.level);
    b.enemyHp = Math.max(0, b.enemyHp - damage);
    $('enemyHpBar').style.width = ((b.enemyHp / b.enemyMaxHp) * 100) + '%';
    enemyCanvas.classList.add('hit');
    setTimeout(function () { enemyCanvas.classList.remove('hit'); }, 300);
    sound.attack();
    popDamage(damage, 'enemy');
    message = 'せいかい！ ' + escapeHtml(b.enemy.name) + ' に ' + damage + ' の ダメージ！';
  } else {
    state.hp = Math.max(0, state.hp - b.enemyAttack);
    sound.damage();
    popDamage(b.enemyAttack, 'player');
    flashScreen();
    message = '<span style="color:var(--danger)">まちがえた！ ' + escapeHtml(b.enemy.name) + ' の こうげき！ '
      + b.enemyAttack + ' の ダメージ！</span>';
  }

  if (q.note) {
    message += '<span class="note">' + escapeHtml(q.note) + '</span>';
  }
  typeMessage($('battleMessage'), message);
  updateStatus();

  if (state.pendingLogs.length >= 10) flushLogs();

  setTimeout(function () {
    if (state.hp <= 0) { showGameOver(); return; }
    if (b.enemyHp <= 0) { winBattle(); return; }
    $('nextBtn').style.display = 'inline-block';
    $('nextBtn').textContent = 'つぎの もんだいへ';
  }, 700);
}

function winBattle() {
  const b = state.battle;
  enemyCanvas.classList.add('defeated');
  sound.defeat();

  state.exp += b.exp;
  let text = '<span style="color:var(--accent)">' + escapeHtml(b.enemy.name) + ' を たおした！ '
    + b.exp + ' の けいけんち を かくとく！</span>';

  // レベルアップ判定
  const newLevel = Math.max(1, Math.floor(state.exp / state.expPerLevel) + 1);
  if (newLevel > state.level) {
    state.level = newLevel;
    state.maxHp = maxHpFor(state.level);
    state.hp = state.maxHp;   // レベルが上がったら全回復
    text += '<span class="lvup" style="display:block;margin-top:6px">レベルが ' + state.level
      + ' に あがった！ HPが ぜんかい した！</span>';
    setTimeout(function () { sound.levelup(); }, 620);
  }

  typeMessage($('battleMessage'), text);
  $('choices').innerHTML = '';
  $('questionText').textContent = '';
  $('questionField').textContent = '';
  $('nextBtn').style.display = 'inline-block';
  $('nextBtn').textContent = 'ぼうけんに もどる';
  state.battle = null;
  updateStatus();
  flushLogs();
}

function continueBattle() {
  const b = state.battle;
  if (!b) { endBattle(); return; }
  const q = pickQuestion();
  b.question = q;
  b.askedAt = Date.now();
  b.answered = false;
  $('battleMessage').innerHTML = '';
  $('msgCursor').classList.remove('show');
  $('nextBtn').style.display = 'none';
  renderQuestion(q);
}

function endBattle() {
  state.battle = null;
  showScreen('gameScreen');
  renderField();
}

function showGameOver() {
  state.battle = null;
  sound.gameover();
  flushLogs();
  showOverlay(
    'ちからつきた…',
    'HPが 0 に なった。<br>おしろ に もどって たてなおそう。<br>けいけんち は そのまま のこる。',
    'おしろへ もどる',
    function () {
      state.hp = state.maxHp;
      state.x = 22; state.y = 22;
      state.steps = 0;
      updateStatus();
      showScreen('gameScreen');
      renderField();
    }
  );
}

// ===== 演出 =====
function popDamage(value, who) {
  const el = $('damagePop');
  el.textContent = value;
  el.className = 'damage-pop ' + who;
  // アニメーションを再生し直すためにいったん外す
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 900);
}

function flashScreen() {
  const el = $('flash');
  el.classList.remove('hit');
  void el.offsetWidth;
  el.classList.add('hit');
  setTimeout(function () { el.classList.remove('hit'); }, 360);
}

// ===== オーバーレイ =====
function showOverlay(title, html, btnLabel, onClick) {
  $('overlayTitle').textContent = title;
  $('overlayText').innerHTML = html;
  $('overlayBtn').textContent = btnLabel;
  $('overlay').classList.add('active');
  $('overlayBtn').onclick = function () {
    $('overlay').classList.remove('active');
    if (onClick) onClick();
  };
}

// ===== サーバー通信 =====
// GAS上ならgoogle.script.run、そうでなければオフラインで動かす
const hasServer = (typeof google !== 'undefined' && google.script && google.script.run);

function setSaveState(text) {
  $('saveState').textContent = text;
  if (text) setTimeout(function () {
    if ($('saveState').textContent === text) $('saveState').textContent = '';
  }, 2500);
}

function flushLogs() {
  if (!hasServer || state.offline) return;
  if (state.saving) return;
  if (!state.pendingLogs.length && !state.playerName) return;

  // サーバーが1回で受け取れるのは200件まで。溢れた分は次回に回す
  const BATCH = 100;
  const batch = state.pendingLogs.slice(0, BATCH);
  const rest = state.pendingLogs.slice(BATCH);

  const payload = {
    playerName: state.playerName,
    className: state.className,
    level: state.level,
    exp: state.exp,
    logs: batch
  };
  const sending = batch.length;
  state.pendingLogs = rest;
  state.saving = true;

  google.script.run
    .withSuccessHandler(function (res) {
      state.saving = false;
      if (res && res.ok) {
        setSaveState('きろく しました');
      } else {
        // 失敗した分は捨てずに戻して、次のまとめ送りで再挑戦する
        state.pendingLogs = payload.logs.concat(state.pendingLogs);
        setSaveState('あとで ほぞん します');
      }
    })
    .withFailureHandler(function () {
      state.saving = false;
      state.pendingLogs = payload.logs.concat(state.pendingLogs);
      setSaveState('あとで ほぞん します');
    })
    .saveSession(payload);

  if (sending) setSaveState('きろくちゅう...');
}

// ===== 起動 =====
function boot() {
  if (!hasServer) {
    // GASの外(ローカル確認用)。組み込みの数問だけで動かす
    state.offline = true;
    state.questions = OFFLINE_QUESTIONS;
    fillClassOptions(['1年A組', '1年B組', '1年C組', '1年D組']);
    $('titleMessage').textContent = 'おためしモード（きろくは ほぞんされません）';
    $('startBtn').disabled = false;
    return;
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.ok) {
        $('titleMessage').textContent = (res && res.message) || 'よみこみに しっぱい しました';
        state.offline = true;
        state.questions = OFFLINE_QUESTIONS;
        fillClassOptions(['1年A組', '1年B組', '1年C組', '1年D組']);
        $('startBtn').disabled = false;
        return;
      }
      state.questions = res.questions;
      state.encounterRate = res.config.encounterRate;
      state.expPerLevel = res.config.expPerLevel;
      applySoundSetting(res.config.soundEnabled !== false);
      fillClassOptions(res.config.classes.length ? res.config.classes : ['1組', '2組', '3組', '4組']);
      $('titleMessage').textContent = 'もんだい ' + res.questions.length + ' もん を よみこみました';
      $('startBtn').disabled = false;
    })
    .withFailureHandler(function (err) {
      $('titleMessage').textContent = 'つうしんに しっぱい しました。おためしモードで あそべます';
      state.offline = true;
      state.questions = OFFLINE_QUESTIONS;
      fillClassOptions(['1年A組', '1年B組', '1年C組', '1年D組']);
      $('startBtn').disabled = false;
    })
    .getGameData('', '');
}

// 先生が設定シートで決めた既定値を画面に反映する
function applySoundSetting(enabled) {
  sound.enabled = enabled;
  const btn = $('soundBtn');
  btn.textContent = enabled ? '♪ おと ON' : '♪ おと OFF';
  btn.classList.toggle('on', enabled);
}

function fillClassOptions(classes) {
  const sel = $('inputClass');
  sel.innerHTML = '';
  classes.forEach(function (c) {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
}

function startGame() {
  const name = $('inputName').value.trim();
  if (!name) {
    $('titleMessage').textContent = 'なまえを いれてください';
    $('inputName').focus();
    return;
  }
  state.playerName = name;
  state.className = $('inputClass').value || '未設定';
  $('startBtn').disabled = true;
  $('titleMessage').textContent = 'よみこみちゅう...';

  if (!hasServer || state.offline) {
    beginAdventure({ level: 1, exp: 0 });
    return;
  }

  // 問題は起動時に取得済み。ここでは進捗だけを取りに行く(通信を軽くするため)
  google.script.run
    .withSuccessHandler(function (res) {
      beginAdventure((res && res.progress) || { level: 1, exp: 0 });
    })
    .withFailureHandler(function () { beginAdventure({ level: 1, exp: 0 }); })
    .getProgress(state.playerName, state.className);
}

function beginAdventure(progress) {
  state.level = Math.max(1, Number(progress && progress.level) || 1);
  state.exp = Math.max(0, Number(progress && progress.exp) || 0);
  state.maxHp = maxHpFor(state.level);
  state.hp = state.maxHp;
  state.steps = 0;
  $('startBtn').disabled = false;

  updateStatus();
  showScreen('gameScreen');
  renderField();

  if (state.level > 1) {
    setSaveState('レベル ' + state.level + ' から さいかい');
  }
}

// ===== 入力 =====
const KEY_DIR = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right'
};

document.addEventListener('keydown', function (e) {
  if ($('battleScreen').classList.contains('active')) {
    // バトル中は数字キーで選択できる
    const n = Number(e.key);
    if (n >= 1 && n <= 4) {
      const btn = $('choices').querySelector('.choice[data-index="' + n + '"]');
      if (btn && !btn.disabled) btn.click();
      return;
    }
    if (e.key === 'Enter' && $('nextBtn').style.display !== 'none') $('nextBtn').click();
    return;
  }
  if (!$('gameScreen').classList.contains('active')) return;
  const dir = KEY_DIR[e.key];
  if (dir) { e.preventDefault(); tryMove(dir); }
});

// タッチ操作の十字キー。押しっぱなしで歩き続ける
let holdTimer = null;
document.querySelectorAll('#dpad button[data-dir]').forEach(function (btn) {
  const dir = btn.dataset.dir;
  function press(e) {
    e.preventDefault();
    tryMove(dir);
    clearInterval(holdTimer);
    holdTimer = setInterval(function () { tryMove(dir); }, 180);
  }
  function release() { clearInterval(holdTimer); }
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('mousedown', press);
  btn.addEventListener('touchend', release);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});

$('menuBtn').addEventListener('click', function () {
  sound.select();

  let total = 0, hit = 0;
  const rows = [];
  Object.keys(state.fieldStats).forEach(function (field) {
    const s = state.fieldStats[field];
    total += s.total;
    hit += s.correct;
    const rate = Math.round((s.correct / s.total) * 100);
    // 正答率が低い分野ほど目立たせる。苦手を自覚してもらうため
    const color = rate >= 80 ? 'var(--correct)' : (rate >= 50 ? 'var(--accent)' : 'var(--danger)');
    rows.push(
      '<tr><td style="text-align:left;padding:3px 8px">' + escapeHtml(field) + '</td>'
      + '<td style="padding:3px 8px;color:' + color + '">' + rate + '%</td>'
      + '<td style="padding:3px 8px;color:var(--muted);font-size:12px">' + s.correct + '/' + s.total + '</td></tr>'
    );
  });

  let html = '<div style="text-align:left;line-height:1.9">'
    + 'なまえ: ' + escapeHtml(state.playerName) + '<br>'
    + 'クラス: ' + escapeHtml(state.className) + '<br>'
    + 'レベル: ' + state.level + '<br>'
    + 'けいけんち: ' + state.exp
    + '（つぎまで あと ' + Math.max(0, state.level * state.expPerLevel - state.exp) + '）<br>'
    + 'あるいた ほすう: ' + state.steps
    + '</div>';

  if (total) {
    html += '<div style="margin-top:14px;border-top:2px solid #2a2a3a;padding-top:12px">'
      + '<div style="color:var(--accent);margin-bottom:6px">こたえた もんだい ' + total + ' もん / せいかい ' + hit + ' もん</div>'
      + '<table style="width:100%;font-size:14px">' + rows.join('') + '</table>';
    if (state.wrongQueue.length) {
      html += '<div style="margin-top:10px;font-size:13px;color:var(--muted)">'
        + 'まちがえた もんだい ' + state.wrongQueue.length + ' もんは、また でてくるぞ</div>';
    }
    html += '</div>';
  } else {
    html += '<div style="margin-top:12px;color:var(--muted);font-size:13px">'
      + 'まだ もんだいに こたえていない</div>';
  }

  showOverlay('ぼうけんの しょ', html, 'とじる', function () { flushLogs(); });
});

$('startBtn').addEventListener('click', function () {
  sound.init();      // 音はユーザーの操作をきっかけにしか鳴らせない
  sound.decide();
  startGame();
});
$('inputName').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { sound.init(); sound.decide(); startGame(); }
});
$('nextBtn').addEventListener('click', function () {
  sound.select();
  if (state.battle) continueBattle();
  else endBattle();
});

$('soundBtn').addEventListener('click', function () {
  sound.enabled = !sound.enabled;
  this.textContent = sound.enabled ? '♪ おと ON' : '♪ おと OFF';
  this.classList.toggle('on', sound.enabled);
  if (sound.enabled) { sound.init(); sound.select(); }
});

// 授業の終わりにタブを閉じても、たまったログを取りこぼさない
window.addEventListener('pagehide', function () {
  if (state.pendingLogs.length) flushLogs();
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden' && state.pendingLogs.length) flushLogs();
});

// ===== オフライン用の問題 =====
// サーバーにつながらない時でもゲームだけは動くように、少しだけ持っておく
const OFFLINE_QUESTIONS = [
  { id: 'S1', field: '世界の地形', level: 1, text: '世界でいちばん面積が大きい国はどこですか。', choices: ['ロシア', 'カナダ', '中国', 'アメリカ合衆国'], answer: 1, note: '日本の約45倍の面積があります。' },
  { id: 'S2', field: '世界の気候', level: 1, text: '赤道付近に広がる、1年中暑くて雨が多い気候帯はどれですか。', choices: ['寒帯', '乾燥帯', '熱帯', '冷帯'], answer: 3, note: '熱帯雨林が広がっています。' },
  { id: 'S3', field: '日本の地形', level: 1, text: '日本でいちばん長い川はどれですか。', choices: ['利根川', '石狩川', '信濃川', '北上川'], answer: 3, note: '長野県から新潟県へ流れます。' },
  { id: 'S4', field: '日本の産業', level: 2, text: '日本で自動車の生産がとくにさかんな工業地帯はどれですか。', choices: ['京浜工業地帯', '中京工業地帯', '阪神工業地帯', '北九州工業地帯'], answer: 2, note: '愛知県の豊田市などが中心です。' },
  { id: 'S5', field: '地図の読み方', level: 2, text: '地図で、同じ高さの地点を結んだ線を何といいますか。', choices: ['等高線', '経線', '緯線', '等圧線'], answer: 1, note: '線の間隔がせまいほど傾きが急です。' },
  { id: 'S6', field: '日本の地形', level: 2, text: '日本の都道府県はいくつありますか。', choices: ['43', '45', '47', '49'], answer: 3, note: '1都1道2府43県です。' }
];

// ===== 開始 =====
updateStatus();
boot();
requestAnimationFrame(loop);
</script>
